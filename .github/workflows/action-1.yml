name: Java Maven Build & Publish Artifact

on:
  push:
    branches: [ "develop" ] # Run when a push happens on the develop branch
  pull_request:
    branches: [ "develop" ] # Run when a pull request targets the develop branch

jobs:
  build_test:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7 # refer https://github.com/actions or https://github.com/marketplace?type=actions
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml

  publish-job:
    runs-on: ubuntu-latest
    needs: build_test # pre-condition job
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: mvn --batch-mode --update-snapshots verify
      - run: mkdir staging && cp target/*.jar staging
      - uses: actions/upload-artifact@v7
        with:
          name: Package
          path: staging